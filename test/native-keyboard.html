<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>native keyboard test</title>
  <style>
    body { font: 12px/1.5 ui-monospace, monospace; margin: 0; padding: 10px; background: #fff; color: #111; }
    #out { white-space: pre; }
    .pass { color: #0a7d28; } .fail { color: #c00; font-weight: bold; }
    iframe { border: 1px solid #bbb; display: block; margin: 6px 0; }
    #frames { opacity: .35; }
  </style>
</head>
<body>
<div id="out">running…</div>
<div id="frames"></div>
<script>
/*
 * Covers the phone-keyboard path. Must be run with a coarse pointer emulated
 * (--blink-settings=availablePointerTypes=2,primaryPointerType=2) or the app
 * correctly decides it is on a desktop and never renders the hidden input.
 *
 * Typing is simulated the way a browser actually performs it: set the field's
 * value, then dispatch the event the keyboard would have produced. The Gboard
 * case wraps that in composition events, which is what broke the previous
 * inputType-based implementation on a real device.
 *
 * Shrinking the iframe stands in for the native keyboard claiming the bottom of
 * the screen. Chrome updates the frame's visualViewport.height but fires no
 * resize event for an iframe resized by its parent, so the test dispatches the
 * event itself; the handler still reads the real, already-updated viewport.
 */
const W = 390, TALL = 844, SHORT = 400

const out = document.getElementById('out')
const frames = document.getElementById('frames')
const lines = []
let failures = 0
const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

function check(label, ok, detail) {
  if (!ok) failures++
  lines.push(`   ${ok ? '[ok]  ' : '[FAIL]'} ${label}${detail ? ' — ' + detail : ''}`)
  out.innerHTML = render()
}
function section(t) { lines.push(t); out.innerHTML = render() }

const strip = (doc) => doc.querySelector('[role="group"][aria-label="Letter status"]')
const fullKeyboard = (doc) => doc.querySelector('button[aria-label="Q"]')
const hiddenInput = (doc) => doc.querySelector('input[enterkeyhint="go"]')

function rowText(doc, row) {
  const tiles = doc.querySelectorAll('[data-tile]')
  let s = ''
  for (let i = row * 5; i < row * 5 + 5; i++) s += (tiles[i].textContent || '').trim()
  return s
}

/** Type as a browser does: mutate the value, then announce it. */
function typeRaw(win, el, value) {
  el.value = value
  el.dispatchEvent(new win.InputEvent('input', { bubbles: true, inputType: 'insertText' }))
}

/** Gboard: every letter arrives inside one composition. */
async function typeComposed(win, el, text) {
  el.dispatchEvent(new win.CompositionEvent('compositionstart', { bubbles: true }))
  let acc = el.value
  for (const ch of text) {
    acc += ch
    el.dispatchEvent(new win.CompositionEvent('compositionupdate', { bubbles: true, data: ch }))
    el.value = acc
    el.dispatchEvent(new win.InputEvent('input', { bubbles: true, inputType: 'insertCompositionText', data: ch }))
    await sleep(20)
  }
  el.dispatchEvent(new win.CompositionEvent('compositionend', { bubbles: true, data: text }))
  await sleep(60)
}

async function waitForApp(doc, timeout = 25000) {
  const deadline = performance.now() + timeout
  while (performance.now() < deadline) {
    if (doc.querySelectorAll('[data-tile]').length === 30) return true
    await sleep(100)
  }
  return false
}

;(async () => {
  const f = document.createElement('iframe')
  f.style.width = W + 'px'
  f.style.height = TALL + 'px'
  f.src = '/wordle-vue/'
  frames.appendChild(f)
  await new Promise((r) => { f.onload = r; setTimeout(r, 25000) })
  const doc = f.contentDocument
  const win = f.contentWindow
  if (!(await waitForApp(doc))) {
    lines.push('[FAIL] app never mounted'); failures++
    out.innerHTML = render(); document.title = '1 FAILURES'; return
  }
  await sleep(400)

  section('coarse-pointer detection')
  check('hidden native-keyboard input is rendered', !!hiddenInput(doc))
  check('full on-screen keyboard is shown by default', !!fullKeyboard(doc))
  check('status strip is hidden by default', !strip(doc))

  const input = hiddenInput(doc)
  if (!input) {
    lines.push('')
    lines.push('RESULT: ' + failures + ' FAILURE(S)')
    out.innerHTML = render(); document.title = failures + ' FAILURES'; return
  }
  input.focus()

  // The bug this whole change exists for: Gboard reports insertCompositionText,
  // which the previous implementation ignored, so nothing reached the board.
  section('Gboard — letters arrive inside a composition')
  await typeComposed(win, input, 'CRA')
  check('composed letters reach the board', rowText(doc, 0) === 'CRA', `row = "${rowText(doc, 0)}"`)

  section('iOS — letters arrive as plain edits')
  typeRaw(win, input, '')
  await sleep(60)
  check('clearing the field clears the row', rowText(doc, 0) === '', `row = "${rowText(doc, 0)}"`)
  typeRaw(win, input, 'C'); await sleep(40)
  typeRaw(win, input, 'CR'); await sleep(40)
  typeRaw(win, input, 'CRAN'); await sleep(60)
  check('plain edits reach the board', rowText(doc, 0) === 'CRAN', `row = "${rowText(doc, 0)}"`)

  section('backspace needs no special handling')
  typeRaw(win, input, 'CRA'); await sleep(60)
  check('shrinking the field shrinks the row', rowText(doc, 0) === 'CRA', `row = "${rowText(doc, 0)}"`)
  typeRaw(win, input, ''); await sleep(60)
  check('deleting everything empties the row', rowText(doc, 0) === '', `row = "${rowText(doc, 0)}"`)
  typeRaw(win, input, ''); await sleep(60)
  check('backspace on an empty row is harmless', rowText(doc, 0) === '', `row = "${rowText(doc, 0)}"`)

  section('input is sanitised')
  typeRaw(win, input, 'c1r a2n'); await sleep(60)
  check('digits and spaces are dropped, case normalised', rowText(doc, 0) === 'CRAN', `row = "${rowText(doc, 0)}"`)
  typeRaw(win, input, 'ABCDEFGH'); await sleep(60)
  check('row never exceeds five letters', rowText(doc, 0) === 'ABCDE', `row = "${rowText(doc, 0)}"`)
  check('field is trimmed back to the row', input.value === 'ABCDE', `value = "${input.value}"`)

  section('the two keyboards stay in step')
  typeRaw(win, input, ''); await sleep(60)
  const qKey = fullKeyboard(doc)
  qKey.click(); await sleep(80)
  qKey.click(); await sleep(80)
  check('on-screen keys reach the board', rowText(doc, 0) === 'QQ', `row = "${rowText(doc, 0)}"`)
  check('hidden field follows the on-screen keyboard', input.value === 'QQ', `value = "${input.value}"`)

  const revealBtn = [...doc.querySelectorAll('button')].find((b) => /Reveal/i.test(b.textContent))
  if (revealBtn) {
    revealBtn.click(); await sleep(120)
    check('hidden field follows a hint', input.value === rowText(doc, 0), `value = "${input.value}" row = "${rowText(doc, 0)}"`)
  }

  section('the go key submits')
  typeRaw(win, input, 'AB'); await sleep(60)
  input.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }))
  await sleep(300)
  const toast = doc.querySelector('.toast-fade')
  check('Enter with a short word is rejected, not swallowed', !!toast, toast ? `toast "${toast.textContent.trim()}"` : 'no toast shown')

  section('native keyboard opens (viewport shrinks to ' + SHORT + 'px)')
  typeRaw(win, input, ''); await sleep(60)
  f.style.height = SHORT + 'px'
  win.visualViewport.dispatchEvent(new Event('resize'))
  await sleep(700)
  check('status strip replaces the on-screen keyboard', !!strip(doc) && !fullKeyboard(doc),
    `strip=${!!strip(doc)} fullKeyboard=${!!fullKeyboard(doc)}`)

  const de = doc.documentElement
  check('no horizontal scroll while keyboard is open', de.scrollWidth - de.clientWidth <= 0,
    `over=${de.scrollWidth - de.clientWidth}`)
  check('no vertical scroll while keyboard is open', de.scrollHeight - de.clientHeight <= 0,
    `over=${de.scrollHeight - de.clientHeight}`)

  let clipped = null
  for (const el of doc.querySelectorAll('[data-tile]')) {
    const r = el.getBoundingClientRect()
    const by = Math.max(-r.left, -r.top, r.right - W, r.bottom - SHORT)
    if (by > 0.5 && (!clipped || by > clipped)) clipped = by
  }
  check('all 30 tiles still fully visible', !clipped, clipped ? `clipped by ${clipped.toFixed(1)}px` : '30 tiles')

  section('native keyboard closes (viewport restored)')
  f.style.height = TALL + 'px'
  win.visualViewport.dispatchEvent(new Event('resize'))
  await sleep(700)
  check('on-screen keyboard comes back', !!fullKeyboard(doc) && !strip(doc),
    `strip=${!!strip(doc)} fullKeyboard=${!!fullKeyboard(doc)}`)

  lines.push('')
  lines.push(failures === 0 ? 'RESULT: ALL PASS' : `RESULT: ${failures} FAILURE(S)`)
  out.innerHTML = render()
  document.title = failures === 0 ? 'ALL PASS' : failures + ' FAILURES'
})()

function render() {
  return lines
    .map((l) => l.includes('[FAIL]') ? `<span class="fail">${l}</span>`
              : l.includes('[ok]') ? `<span class="pass">${l}</span>` : l)
    .join('\n')
}
</script>
</body>
</html>
